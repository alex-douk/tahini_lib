[package]
name = "hoodini_server"
version = "0.1.0"
edition = "2021"
authors = ["Alexandre Doukhan"]

[lib]
name = "hoodini_server"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"], optional = true}
ctor = {version = "0.4.2", optional = true}
hex = { version = "0.4.3", features = ["serde"] }
lazy_static = {version = "1.5.0"}
hoodini_core = {version="0.1.0", path="../hoodini-core/"}
fizz_rs = {git = "https://github.com/alex-douk/fizz-rs.git", branch = "lib"}
serde_json = "1.0.145"
